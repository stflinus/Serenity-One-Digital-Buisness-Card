<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dan Tucker - Digital Business Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 50px 20px;
            color: #333;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            margin-bottom: 5px;
            color: #111;
        }
        .title {
            color: #666;
            font-style: italic;
            margin-bottom: 15px;
        }
        .company {
            font-weight: bold;
            color: #003366;
            margin-bottom: 25px;
        }
        .contact-info {
            text-align: left;
            display: inline-block;
            margin-bottom: 25px;
        }
        p {
            margin: 10px 0;
            font-size: 16px;
        }
        a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Dan Tucker</h1>
        <div class="title">Field Manager</div>
        <div class="company">Serenity 1 Consulting Group</div>

        <div class="contact-info">
            <p><strong>Cell Phone:</strong> <a href="tel:4076768468">(407) 676-8468</a></p>
            <p><strong>Intake Department:</strong> <a href="tel:8662227309">(866) 222-7309</a></p>
            <p><strong>Website:</strong> <a href="https://sonecg.com/" target="_blank">sonecg.com</a></p>
        </div>
    </div>

</body>
</html>

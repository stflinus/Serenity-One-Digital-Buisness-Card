<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dan Tucker - Digital Business Card</title>
    <style>
        :root {
            --primary-color: #1e3a8a; /* Deep professional blue */
            --secondary-color: #3b82f6; /* Accent blue */
            --text-dark: #1f2937;
            --text-light: #4b5563;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            text-align: center;
            transition: transform 0.2s;
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 40px 20px;
            color: white;
        }

        .profile-initials {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 3px solid white;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .card-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-header p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .card-body {
            padding: 30px 24px;
        }

        .company-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 24px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #172554;
        }

        .btn-secondary {
            background-color: #f3f4f6;
            color: var(--text-dark);
            border: 1px solid #e5e7eb;
        }

        .btn-secondary:hover {
            background-color: #e5e7eb;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.7;
            margin-bottom: 2px;
        }

        .btn-text {
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Header Section with Name & Title -->
        <div class="card-header">
            <div class="profile-initials">DT</div>
            <h1>Dan Tucker</h1>
            <p>Field Manager</p>
        </div>

        <!-- Body Section with Company & Quick Action Buttons -->
        <div class="card-body">
            <div class="company-name">Serenity 1 Consulting Group</div>
            
            <div class="links-container">
                <!-- Mobile Cell Number Link -->
                <a href="tel:4076768468" class="btn btn-primary">
                    <div>
                        <span class="btn-label">Call Cell Phone</span>
                        <span class="btn-text">(407) 676-8468</span>
                    </div>
                </a>

                <!-- Intake Department Number Link -->
                <a href="tel:8662227309" class="btn btn-primary">
                    <div>
                        <span class="btn-label">Call Intake Department</span>
                        <span class="btn-text">(866) 222-7309</span>
                    </div>
                </a>

                <!-- Company Website Link -->
                <a href="https://sonecg.com/" target="_blank" rel="noopener" class="btn btn-secondary">
                    <div>
                        <span class="btn-label">Visit Our Website</span>
                        <span class="btn-text">sonecg.com</span>
                    </div>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
